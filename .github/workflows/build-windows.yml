name: Build Windows

on:
  push:
    branches: [feature/windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout LidarView
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup SSH and fetch submodules
      env:
        KEY_SEYOND: ${{ secrets.DEPLOY_KEY_SEYOND }}
        KEY_LITE_SDK: ${{ secrets.DEPLOY_KEY_LITE_SDK }}
      run: |
        $sshDir = "$env:USERPROFILE\.ssh"
        New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

        $env:KEY_SEYOND | Set-Content "$sshDir\deploy_key_seyond" -NoNewline
        $env:KEY_LITE_SDK | Set-Content "$sshDir\deploy_key_lite_sdk" -NoNewline

        icacls "$sshDir\deploy_key_seyond" /inheritance:r /grant:r "${env:USERNAME}:(R)"
        icacls "$sshDir\deploy_key_lite_sdk" /inheritance:r /grant:r "${env:USERNAME}:(R)"

        git config --global --unset-all url.https://github.com/.insteadOf
        git submodule init Plugins/VelodynePlugin Plugins/HesaiPlugin Plugins/LivoxPlugin Plugins/LeishenPlugin Plugins/RobosensePlugin Plugins/OusterPlugin
        git submodule update --recursive Plugins/VelodynePlugin Plugins/HesaiPlugin Plugins/LivoxPlugin Plugins/LeishenPlugin Plugins/RobosensePlugin Plugins/OusterPlugin

        $gitSsh = "C:/Program Files/Git/usr/bin/ssh.exe"
        $unixSshDir = $sshDir -replace '\\', '/'
        $env:GIT_SSH_COMMAND = "`"$gitSsh`" -i $unixSshDir/deploy_key_seyond -o StrictHostKeyChecking=no"
        git submodule init Plugins/SeyondPlugin
        git submodule update Plugins/SeyondPlugin

        $env:GIT_SSH_COMMAND = "`"$gitSsh`" -i $unixSshDir/deploy_key_lite_sdk -o StrictHostKeyChecking=no"
        Push-Location Plugins/SeyondPlugin
        git submodule update --init --recursive
        Pop-Location
      shell: pwsh

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Qt6 6.9.2
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.9.2 win64_msvc2022_64 -m qt5compat qtmultimedia --outputdir $env:RUNNER_TEMP\Qt
      shell: pwsh

    - name: Install WiX 3.14
      run: |
        $ProgressPreference = "SilentlyContinue"
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:TEMP\wix314.zip"
        Expand-Archive "$env:TEMP\wix314.zip" -DestinationPath "$env:GITHUB_WORKSPACE\.github\wix"
        echo "WIX=$env:GITHUB_WORKSPACE\.github\wix" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Clone superbuild
      working-directory: ..
      run: |
        git clone --depth=1 https://gitlab.kitware.com/LidarView/lidarview-superbuild.git
        cd lidarview-superbuild
        git submodule update --init --recursive
      shell: pwsh

    - name: Patch superbuild
      run: |
        python3 - <<'PYEOF'
        import re

        # 1. Patch boost.cmake - make MSVC 19.51 recognized (map to 14.3)
        with open('../lidarview-superbuild/pvsb/superbuild/projects/win32/boost.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        # The upstream file has: elseif (NOT MSVC_VERSION VERSION_GREATER 1949) / set(msvc_ver 14.3) / else () / message(FATAL_ERROR...
        # We change the 1949 threshold to 1999 so MSVC 19.51 falls into the 14.3 bucket
        content = content.replace(
            "elseif (NOT MSVC_VERSION VERSION_GREATER 1949)\n  set(msvc_ver 14.3)\nelse ()\n  message(FATAL_ERROR",
            "elseif (NOT MSVC_VERSION VERSION_GREATER 1999)\n  set(msvc_ver 14.3)\nelse ()\n  message(FATAL_ERROR"
        )
        with open('../lidarview-superbuild/pvsb/superbuild/projects/win32/boost.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 2. Create user-config.jam in USERPROFILE directory (b2 auto-discovers it there)
        import os
        home = os.environ.get('USERPROFILE', 'C:/Users/runneradmin')
        user_config_content = 'using msvc : 14.3 : cl.exe : <setup>"C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Auxiliary/Build/vcvarsall.bat" ;\n'
        jam_path = os.path.join(home, 'user-config.jam')
        with open(jam_path, 'w', encoding='utf-8', newline='') as f:
            f.write(user_config_content)
        print(f"Created user-config.jam at {jam_path}")

        # 3. Patch boost.common.cmake - hardcode bootstrap.bat msvc, add variant=release, use our user-config
        with open('../lidarview-superbuild/pvsb/superbuild/projects/boost.common.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        content = re.sub(r'bootstrap\.bat\s+\$\{boost_bootstrap_toolset\}', 'bootstrap.bat msvc', content)
        # Add variant=release after the initial set of boost_options (user-config auto-discovered from USERPROFILE)
        content = content.replace(
            'list(APPEND boost_options\n  --prefix=<INSTALL_DIR>)',
            'list(APPEND boost_options\n  --prefix=<INSTALL_DIR>\n  variant=release)')
        with open('../lidarview-superbuild/pvsb/superbuild/projects/boost.common.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 4. Patch pcap.cmake - disable Remote and OpenSSL
        with open('../lidarview-superbuild/projects/win32/pcap.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        content = content.replace('CMAKE_ARGS', 'CMAKE_ARGS\n    -DENABLE_REMOTE:BOOL=OFF\n    -DUSE_OPENSSL:BOOL=OFF', 1)
        with open('../lidarview-superbuild/projects/win32/pcap.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 4b. Patch SeyondPlugin - add seyond-lite-sdk include path for MSVC
        # The header driver_param.hpp includes "seyond/log/log.hpp" which is in seyond-lite-sdk/,
        # but only vtkseyondsdk/ was in the include path.
        seyon_interp = 'Plugins/SeyondPlugin/SeyondPacketInterpreters/CMakeLists.txt'
        with open(seyon_interp, 'r', encoding='utf-8') as f:
            content = f.read()
        old_block = ('target_include_directories(SeyondPacketInterpreters PRIVATE\n'
                     '  ${CMAKE_CURRENT_SOURCE_DIR}/../SeyondSDK/vtkseyondsdk\n'
                     ')')
        # Only patch if old block is exactly there (no seyond-lite-sdk yet)
        if old_block in content:
            new_block = ('target_include_directories(SeyondPacketInterpreters PRIVATE\n'
                         '  ${CMAKE_CURRENT_SOURCE_DIR}/../SeyondSDK/vtkseyondsdk\n'
                         '  ${CMAKE_CURRENT_SOURCE_DIR}/../SeyondSDK/vtkseyondsdk/seyond-lite-sdk\n'
                         ')')
            content = content.replace(old_block, new_block)
            with open(seyon_interp, 'w', encoding='utf-8', newline='') as f:
                f.write(content)
            print("Patched SeyondPacketInterpreters/CMakeLists.txt with seyond-lite-sdk include")
        else:
            print("SeyondPacketInterpreters/CMakeLists.txt already patched or changed")

        # 4c. Globally inject CMAKE_POLICY_VERSION_MINIMUM in SuperbuildMacros.cmake
        # This adds the flag to ALL ExternalProject_Add cmake args, fixing old cmake_minimum_required issues
        with open('../lidarview-superbuild/pvsb/superbuild/cmake/SuperbuildMacros.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        # Find the central CMAKE_ARGS block that's passed to all ExternalProject_Add calls
        # Inject our flag right after -DCMAKE_EXPORT_NO_PACKAGE_REGISTRY:BOOL=ON
        content = content.replace(
            '-DCMAKE_EXPORT_NO_PACKAGE_REGISTRY:BOOL=ON\n',
            '-DCMAKE_EXPORT_NO_PACKAGE_REGISTRY:BOOL=ON\n      -DCMAKE_POLICY_VERSION_MINIMUM:STRING=3.5\n'
        )
        with open('../lidarview-superbuild/pvsb/superbuild/cmake/SuperbuildMacros.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 5. Patch SuperbuildVersionMacros.cmake - fallback version
        with open('../lidarview-superbuild/pvsb/superbuild/cmake/SuperbuildVersionMacros.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        old_line = '  _superbuild_parse_version(parsed ${output})'
        new_block = '''          if (NOT output)
            if (default)
              set(output "${default}")
            else ()
              set(output "5.3.0")
            endif ()
          endif ()
          _superbuild_parse_version(parsed "${output}")'''
        content = content.replace(old_line, new_block)
        with open('../lidarview-superbuild/pvsb/superbuild/cmake/SuperbuildVersionMacros.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        print("All patches applied successfully")
        PYEOF
      shell: bash

    - name: Clean MinGW and Strawberry from PATH
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw|msys64|Strawberry' }) -join ';'
        echo "PATH=$env:PATH" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Configure
      env:
        Qt6_DIR: ${{ runner.temp }}\Qt\6.9.2\msvc2022_64\lib\cmake\Qt6
      run: |
        $workspace = $env:GITHUB_WORKSPACE
        cmake -S ..\lidarview-superbuild -B D:\build -GNinja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_Fortran_COMPILER=OFF `
          -DCMAKE_POLICY_VERSION_MINIMUM:STRING=3.5 `
          -DUSE_SYSTEM_qt6=ON `
          -DUSE_SYSTEM_boost=OFF `
          -Dlidarview_SOURCE_SELECTION=source `
          -Dlidarview_SOURCE_DIR="$workspace" `
          -DLIDARVIEW_BUILD_ALL_MODULES=OFF `
          -DBUILD_TESTING=OFF `
          -DENABLE_lidarview=ON `
          -DENABLE_hesaisdk=ON `
          -DENABLE_velodynesdk=ON `
          -DENABLE_opencv=ON `
          -DENABLE_numpy=ON `
          -DENABLE_scipy=ON `
          -DENABLE_pythonpygments=ON `
          -DENABLE_openmp=ON `
          -DENABLE_tbb=ON `
          -DENABLE_slam=OFF `
          -DENABLE_g2o=OFF `
          -DENABLE_gtsam=OFF `
          -DENABLE_pcl=OFF `
          -DENABLE_pclplugin=OFF `
          -DENABLE_ros2io=OFF `
          -DENABLE_lz4=OFF `
          -DENABLE_zstd=OFF `
          -DENABLE_fastdds=OFF `
          -DENABLE_teaserpp=OFF `
          -DENABLE_ceres=OFF `
          -DENABLE_nanoflann=OFF `
          -DENABLE_pdal=OFF `
          -DENABLE_xerces=OFF `
          -DENABLE_paraviewweb=OFF `
          -DSUPERBUILD_PROJECT_PARALLELISM=1 `
          -DPARAVIEW_EXTRA_CMAKE_ARGUMENTS:STRING="-DVTK_ENABLE_BULK_INSTANTIATE=OFF"
      shell: pwsh

    - name: Build
      run: cmake --build D:\build --parallel 2 --config Release
      shell: pwsh

    - name: Package
      run: |
        Set-Location D:\build
        ctest -R cpack --output-on-failure --timeout 6400
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LidarView-Windows
        path: D:\build\LidarView-*.zip
        retention-days: 30
