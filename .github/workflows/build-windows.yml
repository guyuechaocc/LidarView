name: Build Windows

on:
  push:
    branches: [feature/windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout LidarView
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup SSH and fetch submodules
      env:
        KEY_SEYOND: ${{ secrets.DEPLOY_KEY_SEYOND }}
        KEY_LITE_SDK: ${{ secrets.DEPLOY_KEY_LITE_SDK }}
      run: |
        $sshDir = "$env:USERPROFILE\.ssh"
        New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

        $env:KEY_SEYOND | Set-Content "$sshDir\deploy_key_seyond" -NoNewline
        $env:KEY_LITE_SDK | Set-Content "$sshDir\deploy_key_lite_sdk" -NoNewline

        icacls "$sshDir\deploy_key_seyond" /inheritance:r /grant:r "${env:USERNAME}:(R)"
        icacls "$sshDir\deploy_key_lite_sdk" /inheritance:r /grant:r "${env:USERNAME}:(R)"

        git config --global --unset-all url.https://github.com/.insteadOf
        git submodule init Plugins/VelodynePlugin Plugins/HesaiPlugin Plugins/LivoxPlugin Plugins/LeishenPlugin Plugins/RobosensePlugin Plugins/OusterPlugin
        git submodule update --recursive Plugins/VelodynePlugin Plugins/HesaiPlugin Plugins/LivoxPlugin Plugins/LeishenPlugin Plugins/RobosensePlugin Plugins/OusterPlugin

        $gitSsh = "C:/Program Files/Git/usr/bin/ssh.exe"
        $unixSshDir = $sshDir -replace '\\', '/'
        $env:GIT_SSH_COMMAND = "`"$gitSsh`" -i $unixSshDir/deploy_key_seyond -o StrictHostKeyChecking=no"
        git submodule init Plugins/SeyondPlugin
        git submodule update Plugins/SeyondPlugin

        $env:GIT_SSH_COMMAND = "`"$gitSsh`" -i $unixSshDir/deploy_key_lite_sdk -o StrictHostKeyChecking=no"
        Push-Location Plugins/SeyondPlugin
        git submodule update --init --recursive
        Pop-Location
      shell: pwsh

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Qt6 6.9.2
      run: |
        pip install aqtinstall
        aqt install-qt windows desktop 6.9.2 win64_msvc2022_64 -m qt5compat qtmultimedia --outputdir $env:RUNNER_TEMP\Qt
      shell: pwsh

    - name: Install WiX 3.14
      run: |
        $ProgressPreference = "SilentlyContinue"
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:TEMP\wix314.zip"
        Expand-Archive "$env:TEMP\wix314.zip" -DestinationPath "$env:GITHUB_WORKSPACE\.github\wix"
        echo "WIX=$env:GITHUB_WORKSPACE\.github\wix" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Clone superbuild
      working-directory: ..
      run: |
        git clone --depth=1 https://gitlab.kitware.com/LidarView/lidarview-superbuild.git
        cd lidarview-superbuild
        git submodule update --init --recursive
      shell: pwsh

    - name: Patch superbuild
      run: |
        python3 - <<'PYEOF'
        import re

        # 1. Patch boost.cmake - MSVC 1949->1999 and add toolset
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\projects\\win32\\boost.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        content = content.replace('1949', '1999')
        content = content.replace('include(boost.common)', 'set(boost_toolset_option "msvc")\ninclude(boost.common)')
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\projects\\win32\\boost.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 2. Patch boost.common.cmake - hardcode bootstrap.bat msvc and add variant=release
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\projects\\boost.common.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        content = re.sub(r'bootstrap\.bat\s+\$\{boost_bootstrap_toolset\}', 'bootstrap.bat msvc', content)
        # Add variant=release after the initial set of boost_options
        content = content.replace(\
            'list(APPEND boost_options\n  --prefix=<INSTALL_DIR>)',
            'list(APPEND boost_options\n  --prefix=<INSTALL_DIR>\n  variant=release)')
        # Wrap b2 build command with vcvarsall to ensure MSVC env is set
        old_build = '''    BUILD_COMMAND
      <SOURCE_DIR>/b2'''
        new_build = '''    BUILD_COMMAND
      cmd.exe /C ^"call ^"C:/Program Files/Microsoft Visual Studio/18/Enterprise/VC/Auxiliary/Build/vcvarsall.bat^" x64 ^&^& <SOURCE_DIR>\\\\b2.exe^"'''
        content = content.replace(old_build, new_build, 1)
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\projects\\boost.common.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 3. Patch pcap.cmake - disable Remote and OpenSSL
        with open('..\\lidarview-superbuild\\projects\\win32\\pcap.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        content = content.replace('CMAKE_ARGS', 'CMAKE_ARGS\n    -DENABLE_REMOTE:BOOL=OFF\n    -DUSE_OPENSSL:BOOL=OFF', 1)
        with open('..\\lidarview-superbuild\\projects\\win32\\pcap.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        # 4. Patch SuperbuildVersionMacros.cmake - fallback version
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\cmake\\SuperbuildVersionMacros.cmake', 'r', encoding='utf-8') as f:
            content = f.read()
        old_line = '  _superbuild_parse_version(parsed ${output})'
        new_block = '''          if (NOT output)
            if (default)
              set(output "${default}")
            else ()
              set(output "5.3.0")
            endif ()
          endif ()
          _superbuild_parse_version(parsed "${output}")'''
        content = content.replace(old_line, new_block)
        with open('..\\lidarview-superbuild\\pvsb\\superbuild\\cmake\\SuperbuildVersionMacros.cmake', 'w', encoding='utf-8', newline='') as f:
            f.write(content)

        print("All patches applied successfully")
        PYEOF
      shell: bash

    - name: Clean MinGW and Strawberry from PATH
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw|msys64|Strawberry' }) -join ';'
        echo "PATH=$env:PATH" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Configure
      env:
        Qt6_DIR: ${{ runner.temp }}\Qt\6.9.2\msvc2022_64\lib\cmake\Qt6
      run: |
        $workspace = $env:GITHUB_WORKSPACE
        cmake -S ..\lidarview-superbuild -B D:\build -GNinja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_Fortran_COMPILER=OFF `
          -DUSE_SYSTEM_qt6=ON `
          -DUSE_SYSTEM_boost=OFF `
          -Dlidarview_SOURCE_SELECTION=source `
          -Dlidarview_SOURCE_DIR="$workspace" `
          -DLIDARVIEW_BUILD_ALL_MODULES=OFF `
          -DBUILD_TESTING=OFF `
          -DENABLE_lidarview=ON `
          -DENABLE_hesaisdk=ON `
          -DENABLE_velodynesdk=ON `
          -DENABLE_opencv=ON `
          -DENABLE_numpy=ON `
          -DENABLE_scipy=ON `
          -DENABLE_pythonpygments=ON `
          -DENABLE_openmp=ON `
          -DENABLE_tbb=ON `
          -DENABLE_slam=OFF `
          -DENABLE_g2o=OFF `
          -DENABLE_gtsam=OFF `
          -DENABLE_pcl=OFF `
          -DENABLE_pclplugin=OFF `
          -DENABLE_ros2io=OFF `
          -DENABLE_lz4=OFF `
          -DENABLE_zstd=OFF `
          -DENABLE_fastdds=OFF `
          -DENABLE_teaserpp=OFF `
          -DENABLE_ceres=OFF `
          -DENABLE_nanoflann=OFF `
          -DENABLE_pdal=OFF `
          -DENABLE_xerces=OFF `
          -DENABLE_paraviewweb=OFF `
          -DSUPERBUILD_PROJECT_PARALLELISM=1 `
          -DPARAVIEW_EXTRA_CMAKE_ARGUMENTS:STRING="-DVTK_ENABLE_BULK_INSTANTIATE=OFF"
      shell: pwsh

    - name: Build
      run: cmake --build D:\build --parallel 2 --config Release
      shell: pwsh

    - name: Package
      run: |
        Set-Location D:\build
        ctest -R cpack --output-on-failure --timeout 6400
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LidarView-Windows
        path: D:\build\LidarView-*.zip
        retention-days: 30
